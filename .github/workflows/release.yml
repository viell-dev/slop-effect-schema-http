name: Release qualification

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version to qualify (from package.json)
        required: true
        type: string

# Preparation only. Publication is an explicit maintainer step in RELEASING.md.
permissions:
  contents: read

jobs:
  candidate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Release preparation reads the hostile suite's lockfile from its own branch.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Verify selected version and branch
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node --input-type=module -e "import assert from 'node:assert/strict'; import p from './package.json' with {type:'json'}; assert.equal(p.version, process.env.RELEASE_VERSION); assert.equal(process.env.GITHUB_REF, 'refs/heads/main');"
      - run: npm ci
      - run: npm run release:prepare
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-${{ matrix.os }}
          path: artifacts/
          if-no-files-found: error

  node-26:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:package

  effect-floor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci
      # The oldest Effect the peer range allows, with the test helpers published for it. The library
      # reads Effect's schema structure, so the floor has to pass the behavior tests, not just load.
      # Saving exact floor specifications preserves unrelated locked dependencies. Reject any
      # unexpected graph drift, then install the generated floor lockfile reproducibly (#193).
      - run: npm install --save-dev --save-exact effect@4.0.7 @effect/vitest@4.0.7
      - run: node scripts/check-effect-floor.mjs
      - run: npm ci
      - run: npm test

  hostile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LIBRARY_REF: ${{ github.sha }}
    steps:
      # Independent suite history, pinned and reviewed separately from the library.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 6df17720e02782ad7da966afb96e9553ea9821bc
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run library
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run library:pack
      - run: npm run packed
      - run: npm run app
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hostile-suite-results
          path: artifacts/
          if-no-files-found: error
