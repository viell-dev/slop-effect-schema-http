name: Hostile suite

on:
  pull_request:
    branches: [hostile-servers-test]
  push:
    branches: [hostile-servers-test]

permissions:
  contents: read

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm library
      - run: pnpm check
      - run: pnpm lint
      # Each lane runs on its own, so a lane that finds no tests fails instead of hiding behind the
      # other. Both write JUnit reports to artifacts/; the browser lane runs even if the Node lane
      # failed, and the catalogue is checked against the executed results once both pass.
      - id: node
        run: pnpm test:node
      - if: ${{ !cancelled() && steps.node.outcome != 'skipped' }}
        run: pnpm test:browser
      - run: pnpm test:catalogue
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hostile-suite-results
          path: artifacts/
          if-no-files-found: error
