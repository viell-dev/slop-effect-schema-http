name: Hostile suite

on:
  # Every pull request whose merge result contains this workflow, including one stacked on another
  # suite branch; pull requests into the library's main do not contain it. An edited description runs
  # it again, for the authorship check.
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [hostile-servers-test]

permissions:
  contents: read

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit and its first parent, the base, for the authorship check's diff.
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # A pull request that changes either side states which agent context wrote which side.
      - if: ${{ github.event_name == 'pull_request' }}
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/authorship.mjs
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run library
      - run: npm run check
      - run: npm run lint
      # Each lane runs on its own, so a lane that finds no tests fails instead of hiding behind the
      # other. Both write JUnit reports to artifacts/; the browser lane runs even if the Node lane
      # failed, and the catalogue is checked against the executed results once both pass.
      - id: node
        run: npm run test:node
      - if: ${{ !cancelled() && steps.node.outcome != 'skipped' }}
        run: npm run test:browser
      - run: npm run test:catalogue
      # The packed lane: the library built and packed at the same commit and installed into
      # node_modules, then the Node lane (its JUnit report in artifacts/ too) and the type-check
      # against that package. It runs whenever the Node lane ran, whatever the source lanes'
      # results; its catalogue check, like theirs, runs once its lane passes.
      - id: pack
        if: ${{ !cancelled() && steps.node.outcome != 'skipped' }}
        run: npm run library:pack
      - id: packed
        if: ${{ !cancelled() && steps.pack.outcome == 'success' }}
        run: npm run packed:test
      - if: ${{ !cancelled() && steps.packed.outcome == 'success' }}
        run: npm run packed:catalogue
      - if: ${{ !cancelled() && steps.pack.outcome == 'success' }}
        run: npm run packed:tsc
      # The app lane: the single-page app in src/app, built by Vite in production mode against the
      # same installed package, served with the same-origin proxy and driven in Chromium from Node
      # (its JUnit report in artifacts/ too). It runs whenever the package was installed; its
      # catalogue check runs once its lane passes.
      - id: app
        if: ${{ !cancelled() && steps.pack.outcome == 'success' }}
        run: npm run app:test
      - if: ${{ !cancelled() && steps.app.outcome == 'success' }}
        run: npm run app:catalogue
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hostile-suite-results
          path: artifacts/
          if-no-files-found: error
