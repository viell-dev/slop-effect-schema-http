[package]
name = "warded-test-host"
version = "0.0.0"
edition = "2024"
rust-version = "1.100"
publish = false
description = "Serves Warded route tables described by the suite's tests, and records what reached them."

[dependencies]
# The commits under test. `warded` is not a direct dependency: the host takes the router through
# `warded_server::warded`, so that both use one set of types. The patch below replaces the
# crates.io release that the server pins with the router commit under test.
warded-server = { git = "https://github.com/viell-dev/slop-warded-server", rev = "ff332121ba83d6a209957396785c5cbfaf7a1bf6" }

axum = { version = "0.8.9", default-features = false, features = ["http1", "http2", "tokio"] }
base64 = "0.23"
# The content of streamed replies, as a stream of chunks. The version that Axum and Hyper use.
futures-util = { version = "0.3.34", default-features = false }
http-body-util = "0.1"
# The HTTP/2 client decodes response heads with it, and the HTTP/3 client its Huffman codes; both
# encode requests themselves.
loona-hpack = "0.4.3"
# The HTTP/3 client's QUIC: the version and features the server uses, so it adds no crate.
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs"] }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
# The versions the server uses, for the HTTP/2 and HTTP/3 clients' TLS.
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false }
tower = { version = "0.5.3", features = ["util"] }

[patch.crates-io]
warded = { git = "https://github.com/viell-dev/slop-warded-router", rev = "7a71066e56c4b26703502954645fa32d8e9b0951" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
