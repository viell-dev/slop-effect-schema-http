events {}
http {
    # Leave merge_slashes unset: this recording exercises nginx's default, on.
    server {
        listen 80;
        server_name business.example;
        default_type application/json;
        add_header X-Request-Uri $request_uri always;
        add_header X-Normalized-Uri $uri always;
        add_header X-Query-String $args always;

        location = /v2/tasks/history {
            return 200 '{"events":[{"task":"T-1001","action":"created","at":1700000000000},{"task":"T-1002","action":"created","at":1700000060000}]}';
        }
        location = /v2/tasks/T-1001/history {
            return 200 '{"events":[{"task":"T-1001","action":"created","at":1700000000000}]}';
        }
        location / {
            return 404 '{"error":"not_found"}';
        }
    }
}
