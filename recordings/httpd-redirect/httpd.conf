# The gateway's old desktop path kept alive by mod_alias. The target is a URL-path, which httpd 2.4
# completes with the scheme, host and port the request's Host header names (UseCanonicalName Off,
# the default).
ServerRoot "/usr/local/apache2"
Listen 80
ServerName gateway.example

LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule alias_module modules/mod_alias.so

User daemon
Group daemon
ErrorLog /proc/self/fd/2
LogFormat "%h \"%r\" %>s %b" brief
CustomLog /proc/self/fd/1 brief

Redirect permanent "/cgi-bin/rpt.exe" "/cgi-bin/report.cgi"
