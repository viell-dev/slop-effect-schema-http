# The gateway's audit endpoint behind mod_auth_digest without qop, the closest form httpd 2.4 has
# to Apache 1.3's RFC 2069 mod_digest. Nonces live three seconds, so the recording can show a stale
# one without a long wait; the module's default is 300 seconds.
ServerRoot "/usr/local/apache2"
Listen 80
ServerName gateway.example

LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule mime_module modules/mod_mime.so
LoadModule alias_module modules/mod_alias.so
LoadModule cgid_module modules/mod_cgid.so
LoadModule authn_core_module modules/mod_authn_core.so
LoadModule authn_file_module modules/mod_authn_file.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_user_module modules/mod_authz_user.so
LoadModule auth_digest_module modules/mod_auth_digest.so

User daemon
Group daemon
ErrorLog /proc/self/fd/2
LogLevel info auth_digest:debug
LogFormat "%h \"%r\" %>s %b" brief
CustomLog /proc/self/fd/1 brief

ScriptAlias "/admin/" "/usr/local/apache2/admin/"
<Location "/admin/">
    AuthType Digest
    AuthName "Reporting Gateway"
    AuthDigestProvider file
    AuthUserFile "/usr/local/apache2/conf/auditors.digest"
    AuthDigestQop none
    AuthDigestNonceLifetime 3
    Require valid-user
</Location>
